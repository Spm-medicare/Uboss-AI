# The local development stack.
#
# Data services only. The API and the web application run from the terminal with hot reload,
# because rebuilding an image on every edit is the fastest way to stop making edits.
#
# Nothing here is a production topology: passwords are fixed, ports are published to the host,
# and there is no TLS. `deploy/` holds the deployed configuration.

name: uboss

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: uboss
      # The bootstrap superuser. The application never connects as this role — see
      # postgres/init/01-roles.sql for the owner/application split that makes row-level security
      # an actual boundary.
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      # Deterministic collation, so an ORDER BY sorts the same way on every machine and in CI.
      POSTGRES_INITDB_ARGS: "--locale-provider=icu --icu-locale=en-US --encoding=UTF8"
    ports:
      # 5433 on the host: the previous UBOSS stack still holds 5432, and taking it away from a
      # running system to save one digit is not a trade worth making. Inside the network the
      # port is still 5432.
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Runs once, on an empty data volume. Editing these files does nothing to a database that
      # already exists — remove the volume to re-run them.
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Names the database and the user: `pg_isready` with no arguments reports healthy while
      # initialisation is still running, which lets dependents start too early.
      test: ["CMD-SHELL", "pg_isready -U postgres -d uboss"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Append-only on: rate-limit counters and idempotency records must survive a restart, or a
    # restart becomes a way to replay a command.
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6380:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    # S3-compatible object storage (PLAN §26). The same API the deployed environment uses, so
    # the code has no "local mode" branch — a storage path that only runs in development is a
    # storage path nobody tests.
    image: minio/minio:latest
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: uboss_minio
      MINIO_ROOT_PASSWORD: uboss_minio_dev_only
    ports:
      # 9002 and 9003: the previous UBOSS stack holds 9000 and 9001.
      - "9002:9000"
      - "9003:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  # ── the durable executor ──────────────────────────────────────────────────────────────
  #
  # PLAN §18 names Temporal, and Gate 7's exit criteria name what it is for: *"crash/retry/
  # idempotency/outbox recovery tests pass."* A run that survives its worker being killed is not
  # something you add to a scheduler afterwards; it decides the shape of every activity.
  #
  # `auto-setup` creates the schema and the default namespace on first start. That is a
  # development convenience and nothing more — `deploy/` provisions Temporal properly, because an
  # image that migrates its own database on boot is not something to point at production data.
  temporal:
    image: temporalio/auto-setup:1.25.2
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_SEEDS: postgres
      POSTGRES_USER: postgres
      POSTGRES_PWD: postgres
      # Its own databases, beside the product's. Sharing one would put Temporal's history in the
      # same backup, the same RLS surface and the same migration history as customer data.
      DBNAME: temporal
      VISIBILITY_DBNAME: temporal_visibility
    ports:
      # 7234 on the host: the previous UBOSS stack still holds Temporal's default 7233, and
      # taking it from a running system to save one digit is not a trade worth making — the same
      # reason postgres is on 5433 here. Inside the network the port is still 7233.
      - "7234:7233"
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "temporal:7233"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s

  # The workflow inspector. Not required to run anything — it is how a person sees why a run is
  # stuck, which during this gate is most of the work.
  temporal-ui:
    image: temporalio/ui:2.31.2
    restart: unless-stopped
    depends_on:
      temporal:
        condition: service_started
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:3000
    ports:
      # 8234, for the same reason as 7234.
      - "8234:8080"

volumes:
  postgres-data:
  redis-data:
  minio-data:
