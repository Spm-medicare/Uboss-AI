# Alembic configuration.
#
# The database URL is NOT written here. It is read from the environment in migrations/env.py, so
# a connection string never reaches version control and a migration cannot be run against the
# wrong database because a file said so.

[alembic]
script_location = migrations
prepend_sys_path = src
# How prepend_sys_path and version_locations are split. Named explicitly because the legacy
# fallback splits on spaces, and this repository lives in a directory whose name has one.
path_separator = os
version_path_separator = os
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
