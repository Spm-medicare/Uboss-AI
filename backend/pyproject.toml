[project]
name = "uboss-api"
version = "0.1.0"
description = "UBOSS AI — governed human + AI work operating system, API"
requires-python = ">=3.12"

#  Lower bounds record the oldest release the product was designed against; `uv.lock` records
#  the exact resolved graph and is what CI and production install from. Pinning both places
#  would mean every routine security patch is a two-file change, which is how patches get
#  skipped.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary,pool]>=3.2",
    "argon2-cffi>=23.1",
    "pyjwt>=2.9",
    "python-multipart>=0.0.20",
    "httpx>=0.28",
    "structlog>=24.4",
    "redis>=5.2",
    # S3-compatible object storage (PLAN §26). The async client, because uploads and downloads
    # sit on the request path and a blocking one would stall the event loop.
    "aioboto3>=13.0",
    # OpenTelemetry-compatible traces, metrics and logs (PLAN §26). The SDK plus the three
    # instrumentations that cover where time is actually spent: the API, the database, and the
    # calls this service makes to other services.
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.48b0",
    "opentelemetry-instrumentation-httpx>=0.48b0",
    # Reading .xlsx for the hierarchy import (PLAN §5). Opened read-only and values-only, so no
    # formula is evaluated and no linked workbook is fetched — a spreadsheet from a customer is
    # untrusted input like any other upload. CSV needs nothing: it is in the standard library.
    "openpyxl>=3.1",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "anyio>=4.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/uboss"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF", "ASYNC", "S"]
ignore = [
    # Assert is how pytest expresses an expectation.
    "S101",
]

[tool.ruff.lint.per-file-ignores]
#  A migration's docstring explains a schema change to a future reader; wrapping SQL to fit a
#  column makes it harder to compare against the database.
"migrations/*" = ["E501"]
#  The exception names read as sentences at the raise site — `raise PermissionDenied(...)` —
#  which is where they are read most. N818's `...Error` suffix would make every one of them
#  noisier without telling the reader anything new.
"src/uboss/core/errors.py" = ["N818"]
#  Same reason: `raise PublisherMissing(...)` reads as a sentence where it is raised.
"src/uboss/modules/audit/relay.py" = ["N818"]
#  `raise FileNotReady(...)` likewise.
"src/uboss/modules/files/service.py" = ["N818"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

#  aioboto3 and botocore ship no type information. Ignoring their missing stubs is narrower than
#  loosening `strict` — everything this project writes stays fully typed, and modules/files wraps
#  the untyped client behind an interface that is.
[[tool.mypy.overrides]]
module = ["aioboto3.*", "botocore.*", "aiobotocore.*", "boto3.*", "openpyxl.*"]
ignore_missing_imports = true

#  Pytest is configured in the repository root pytest.ini, because the suite exercises the
#  schema as much as the Python and has to build a database from the migrations. Configuring it
#  in two places is how the two configurations drift.
