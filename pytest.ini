; Tests run from the repository root, not from backend/.
;
; They exercise the *schema* — row-level security policies, triggers, grants — as much as the
; Python, so they build a throwaway database by running the migrations. That needs both the repo
; root (for `tests`) and `backend/src` (for `uboss`) on the path, which is what pythonpath does.

[pytest]
testpaths = tests
pythonpath = . backend/src backend
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
addopts = -q --strict-markers --strict-config
markers =
    security: tenant isolation, session and permission boundaries
